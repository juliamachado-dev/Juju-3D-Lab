<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo • Impressão 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f3e9dc; --surface:#fffaf3; --ink:#3b2a1e; --muted:#7a6653; --line:#e2d2bd;
  --accent:#c08552; --accent-ink:#2b1c10; --sun:#f6bd3c; --wa:#1fa855; --wa-ink:#fff;
  --shadow:0 1px 2px rgba(59,42,30,.06),0 6px 20px rgba(59,42,30,.08);
  --font:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.45;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* carrossel
.photo{touch-action:pan-y}
.arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:34px;height:34px;border-radius:50%;background:rgba(255,250,243,.92);color:var(--ink);font-size:1.4rem;line-height:1;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.arrow.prev{left:10px}
.arrow.next{right:10px}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:2}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.7);box-shadow:0 0 0 1px rgba(0,0,0,.2);transition:.2s}
.dots i.on{background:#fff;width:18px;border-radius:4px}

/* Header */
.topbar{background:var(--sun);color:var(--ink);font-weight:500;text-align:center;font-size:.78rem;padding:7px 12px;padding-top:calc(7px + env(safe-area-inset-top,0px))}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;padding:28px 20px 8px;gap:6px}
.logo{width:68px;height:68px;border-radius:20px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;overflow:hidden;box-shadow:4px 4px 0 var(--ink);transform:rotate(-6deg)}
.logo img{width:100%;height:100%;object-fit:cover}
.brand h1{font-size:1.7rem;font-weight:700;letter-spacing:-.02em;margin-top:6px}
.brand p{color:var(--muted);max-width:34ch}

/* Filtros */
.filters{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);padding:12px 16px;display:flex;gap:8px;overflow-x:auto;justify-content:center;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.pill{flex:none;display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:500;font-size:.92rem;transition:.15s}
.pill.has-cat{border-color:color-mix(in srgb,var(--cat) 55%,var(--line))}
.pill.has-cat::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--cat)}
.pill[aria-pressed="true"]{background:var(--cat,var(--ink));color:#fff;border-color:var(--cat,var(--ink))}
.pill[aria-pressed="true"]::before{background:#fff}

/* Grid */
main{max-width:1100px;margin:0 auto;padding:8px 16px 0}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:560px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.photo{--c:#999;aspect-ratio:4/3;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 26%,var(--surface));color:var(--c);position:relative;transition:background .25s,color .25s}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo svg{width:34%;height:auto}
.tag{position:absolute;top:12px;left:12px;font-size:.74rem;font-weight:500;background:var(--cat,var(--ink));color:#fff;padding:4px 11px;border-radius:999px}
.body{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}
.swatches{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;border:1px solid rgba(0,0,0,.18);box-shadow:inset 0 0 0 2px var(--surface);transition:transform .12s}
.sw:hover{transform:scale(1.1)}
.sw[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.cname{font-size:.82rem;color:var(--muted);margin-left:4px}
.body h3{font-size:1.1rem;font-weight:600;letter-spacing:-.01em}
.desc{color:var(--muted);font-size:.9rem;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.buy{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto;padding-top:6px}
.price{font-size:1.25rem;font-weight:700}
.btn-add{background:var(--accent);color:var(--accent-ink);padding:10px 22px;border-radius:12px;font-weight:600;min-width:124px;transition:filter .15s}
.btn-add:hover{filter:brightness(1.08)}
.qty{display:inline-flex;align-items:center;justify-content:space-between;min-width:124px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px}
.qty button{width:36px;height:36px;border-radius:9px;background:var(--surface);font-size:1.2rem;font-weight:600;border:1px solid var(--line)}
.qty span{min-width:30px;text-align:center;font-weight:600}
.others{font-size:.8rem;color:var(--muted)}
.others:empty{display:none}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}

/* Barra do carrinho */
.cartbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;z-index:20;background:var(--ink);color:var(--bg);border-radius:18px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.28);transform:translateY(150%);transition:transform .3s cubic-bezier(.2,.8,.2,1);width:calc(100% - 24px)}
.cartbar.show{transform:none}
.cartbar .l{display:flex;align-items:center;gap:10px;font-weight:500}
.badge{background:var(--sun);color:var(--ink);min-width:28px;height:28px;border-radius:999px;display:grid;place-items:center;font-size:.85rem;font-weight:700;padding:0 8px}
.cartbar .r{font-weight:700;font-size:1.05rem}
.cartbar small{opacity:.7;font-weight:400;margin-right:8px}

/* Gaveta */
.overlay{position:fixed;inset:0;background:rgba(10,12,20,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
.overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:92vh;background:var(--surface);border-radius:24px 24px 0 0;z-index:31;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 10px}
.dh h2{font-size:1.2rem}
.close{width:36px;height:36px;border-radius:50%;background:var(--bg);font-size:1.2rem}
.items{overflow-y:auto;padding:4px 20px;flex:1}
.line{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.dot{width:38px;height:38px;border-radius:12px;flex:none;border:1px solid rgba(0,0,0,.15)}
.line .info{flex:1;min-width:0}
.line .info b{display:block;font-weight:600}
.line .info span{font-size:.82rem;color:var(--muted)}
.line .sub{font-weight:600;white-space:nowrap}
.mini{display:inline-flex;align-items:center;gap:6px;margin-top:4px}
.mini button{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.foot{padding:14px 20px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.total{display:flex;justify-content:space-between;font-size:1.15rem;font-weight:700}
.tip{font-size:.84rem;color:var(--muted);background:var(--bg);border-radius:12px;padding:10px 12px}
.wa{background:var(--wa);color:var(--wa-ink);padding:15px;border-radius:14px;font-weight:700;font-size:1rem;display:flex;gap:10px;justify-content:center;align-items:center}
.wa:hover{filter:brightness(1.07)}
.clear{font-size:.85rem;color:var(--muted);text-decoration:underline;align-self:center}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:28px 16px 0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="topbar">Produção sob encomenda • Cores personalizáveis</div>

<header class="brand">
  <div class="logo" id="logo"></div>
  <h1 id="brandName"></h1>
  <p id="tagline"></p>
</header>

<nav class="filters" id="filters" aria-label="Categorias"></nav>

<main>
  <div class="grid" id="grid"></div>
  <footer id="foot"></footer>
</main>

<button class="cartbar" id="cartbar" aria-label="Abrir resumo do pedido">
  <span class="l"><span class="badge" id="cbCount">0</span> <span>Ver pedido</span></span>
  <span class="r" id="cbTotal"></span>
</button>

<div class="overlay" id="overlay"></div>
<section class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle">
  <div class="dh"><h2 id="dTitle">Resumo do pedido</h2><button class="close" id="close" aria-label="Fechar">✕</button></div>
  <div class="items" id="items"></div>
  <div class="foot">
    <div class="total"><span>Total</span><span id="dTotal"></span></div>
    <p class="tip">Problemas com o link? Tire um print desta tela e me envie no whatsapp no número +55 (11) 915704225</p>
    <button class="wa" id="send">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 3.5A11.8 11.8 0 0 0 1.9 17.8L0 24l6.4-1.7A11.8 11.8 0 0 0 12 23.8h0A11.8 11.8 0 0 0 20.5 3.5ZM12 21.8a9.8 9.8 0 0 1-5-1.4l-.4-.2-3.800 1 1-3.700-.2-.4A9.800 9.800 0 1 1 12 21.800Zm5.400-7.300c-.3-.1-1.800-.9-2-1-.3-.1-.5-.1-.7.1l-1 1.200c-.2.200-.4.200-.6.100a8 8 0 0 1-4-3.500c-.3-.5.300-.5.900-1.600.1-.2 0-.4 0-.5l-.9-2.200c-.2-.6-.5-.5-.7-.5h-.6a1.200 1.200 0 0 0-.9.400 3.700 3.700 0 0 0-1.100 2.700c0 1.600 1.200 3.200 1.300 3.400.2.200 2.300 3.500 5.600 4.900 2 .8 2.800.9 3.800.7.600-.1 1.800-.7 2-1.500.3-.7.300-1.300.2-1.500-.1-.1-.3-.2-.6-.3Z"/></svg>
      Enviar Pedido no WhatsApp
    </button>
    <button class="clear" id="clear">Limpar pedido</button>
  </div>
</section>

<script>

const CONFIG = {
  brandName: "Juju 3D Lab",
  tagline: "Ideias que ganham forma, camada por camada.",
  logoUrl: "",                 //imagem logo
  whatsapp: "5511915704225",
  currency: "BRL",
  footerText: "Todos os itens são impressos sob encomenda. Prazo informado no atendimento."
};

//CATEGORIAS
const CATEGORIES = ["Fidget Toys", "Natal"];

//Cor de cada categoria
const CATEGORY_COLORS = {
  "Fidget Toys": "#1d7f74",
  "Natal":       "#c2362f"
};
const catColor = c => CATEGORY_COLORS[c] || "#a0663a";

//PRODUTOS
const COLORS = {
  vermelho:  { name: "Vermelho",  hex: "#e5383b" },
  laranja:   { name: "Laranja",   hex: "#f07d2a" },
  amarelo:   { name: "Amarelo",   hex: "#f5b82e" },
  verde:     { name: "Verde",     hex: "#2faa5e" },
  azul:      { name: "Azul",      hex: "#2f6fed" },
  roxo:      { name: "Roxo",      hex: "#8450e0" },
  rosa:      { name: "Rosa",      hex: "#ee6fa8" },
  branco:    { name: "Branco",    hex: "#f4f4f4" },
  preto:     { name: "Preto",     hex: "#25262b" },
  dourado:   { name: "Dourado",   hex: "#c9a227" },
  marmore:   { name: "Mármore",   hex: "#e6e6e6" },
  bege:      { name: "Bege",      hex: "#e2d2bd" },
  cor_unica: { name: "Cor única", hex: "#afafaf" }
};
const pick = (...keys) => keys.map(k => COLORS[k]);

const PRODUCTS = [
  {
    id: "fid-001", category: "Fidget Toys", name: "Cubo Infinito",
    description: "Cubo articulado infinito. Silencioso e ótimo para aliviar a ansiedade.",
    price: 10.00, images: ["imagens/cubo-infinito.jpg"], colors: pick("vermelho","laranja","amarelo","verde","azul","roxo","rosa","preto","branco")
  },
  {
    id: "nat-001", category: "Natal", name: "Lâmpada Árvore de Natal",
    description: "Árvore branca com led. Leve, resistente e fácil de combinar.",
    price: 19.90, images: ["imagens/arvore-branca.jpg"], colors: pick("cor_unica")
  },
  {
    id: "nat-002", category: "Natal", name: "Árvore de natal com vela",
    description: "Árvore de natal verde com vela led. Luz aconchegante com sombras de estrela.",
    price: 21.90, images: ["imagens/arvore-verde.jpg"], colors: pick("cor_unica")
  },
  {
    id: "nat-003", category: "Natal", name: "Bandeja com Presépio e Árvore de Natal",
    description: "Presépio minimalista com bandeja e árvore de natal. Simples e moderno.",
    price: 39.90, images: ["imagens/presepio-minimalista.jpg"], colors: pick("cor_unica")
  },
  {
    id: "nat-004", category: "Natal", name: "Presépio Sagrada Família",
    description: "Presépio Sagrada família. Inclui 3 peças: Jesus, Maria e José",
    price: 64.95, images: ["imagens/presepio-colorido.jpg"], colors: pick("cor_unica")
  },
  {
    id: "nat-005", category: "Natal", name: "Enfeite de Árvore de Natal",
    description: "Enfeite em formato de presente. Suas melhores memórias decorando sua árvore.",
    price: 8.90, images: ["imagens/presente-dourado.jpg", "imagens/presente-verde.jpg"], colors: pick("dourado", "verde")
  },  
  {
    id: "nat-006", category: "Natal", name: "Porta-terço",
    description: "Porta-terço Nossa senhora do Rosário. Ideal para presentear.",
    price: 22.90, images: ["imagens/porta-terco.jpg"], colors: pick("marmore", "branco", "bege")
  },
  {
    id: "nat-007", category: "Natal", name: "Kit Natalino",
    description: "Papai Noel, rena, boneco de neve e árvore sobre uma bandeja.",
    price: 39.90, images: ["imagens/kit-natalino.jpg"], colors: pick("cor_unica")
  },
  {
    id: "nat-008", category: "Natal", name: "Árvore de Natal Moderna",
    description: "Árvore de natal dourada com design minimalista, simples e elegante.",
    price: 19.90, images: ["imagens/arvore-moderna.jpg"], colors: pick("dourado", "vermelho", "verde")
  },
  {
    id: "nat-009", category: "Natal", name: "Calendário do Advento",
    description: "Calendário do advento 25 dias contagem progressiva até o natal.",
    price: 59.90, images: ["imagens/calendario-advento.png"], colors: pick("cor_unica")
  },
  {
    id: "nat-010", category: "Natal", name: "Estrela de Topo",
    description: "Estrela de topo para árvore de natal. Ideal para completar o visual da sua árvore.",
    price: 14.90, images: ["imagens/estrela-topo.jpg"], colors: pick("cor_unica")
  }
];

//Não mexer daqui para baixo
const $ = s => document.querySelector(s);
const money = v => v.toLocaleString("pt-BR", { style: "currency", currency: CONFIG.currency });
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const cube = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M12 2.5 3.5 7v10L12 21.500 20.500 17V7L12 2.500Z"/><path d="M3.500 7 12 11.500 20.500 7M12 11.500v10" /></svg>';

const state = {
  imgIdx: {},     // foto atual de cada produto
  filter: "Todos",
  colorSel: {},   // id -> índice da cor escolhida
  cart: {}        // "id|indiceDaCor" -> quantidade (mesmo produto em cores diferentes = linhas separadas)
};

const imagesOf = p => p.images?.length ? p.images : (p.image ? [p.image] : []);

function photoHTML(p) {
  const imgs = imagesOf(p);
  if (!imgs.length) return cube;
  const i = state.imgIdx[p.id] || 0;
  const nav = imgs.length > 1
    ? `<button class="arrow prev" data-img="-1" aria-label="Foto anterior">‹</button>
       <button class="arrow next" data-img="1" aria-label="Próxima foto">›</button>
       <div class="dots">${imgs.map((_, n) => `<i class="${n === i ? "on" : ""}"></i>`).join("")}</div>`
    : "";
  return `<img src="${esc(imgs[i])}" alt="${esc(p.name)}" loading="lazy">${nav}`;
}

function moveImg(id, d) {
  const p = byId(id), imgs = imagesOf(p);
  if (imgs.length < 2) return;
  const i = ((state.imgIdx[id] || 0) + d + imgs.length) % imgs.length;
  state.imgIdx[id] = i;
  const photo = document.querySelector(`.card[data-id="${id}"] .photo`);
  photo.querySelector("img").src = imgs[i];
  photo.querySelectorAll(".dots i").forEach((dot, k) => dot.classList.toggle("on", k === i));
}
PRODUCTS.forEach(p => state.colorSel[p.id] = 0);

const byId = id => PRODUCTS.find(p => p.id === id);
const colorOf = p => p.colors[state.colorSel[p.id]];
const keyOf = (id, ci = state.colorSel[id]) => id + "|" + ci;
function othersHTML(p) {
  const cur = state.colorSel[p.id];
  const parts = p.colors.map((c, i) => ({ c, i, q: state.cart[keyOf(p.id, i)] || 0 }))
    .filter(x => x.q > 0 && x.i !== cur)
    .map(x => `${esc(x.c.name)} ×${x.q}`);
  return parts.length ? "No pedido também: " + parts.join(" · ") : "";
}

/* Cabeçalho */
$("#brandName").textContent = CONFIG.brandName;
$("#tagline").textContent = CONFIG.tagline;
$("#foot").textContent = CONFIG.footerText;
$("#logo").innerHTML = CONFIG.logoUrl ? `<img src="${esc(CONFIG.logoUrl)}" alt="Logo ${esc(CONFIG.brandName)}">` : `<span style="width:56%;display:block">${cube}</span>`;
document.title = "Catálogo • " + CONFIG.brandName;

/* Filtros */
function renderFilters() {
  $("#filters").innerHTML = ["Todos", ...CATEGORIES].map(c =>
    `<button class="pill${c === "Todos" ? "" : " has-cat"}" ${c === "Todos" ? "" : `style="--cat:${catColor(c)}"`} data-cat="${esc(c)}" aria-pressed="${c === state.filter}">${esc(c)}</button>`).join("");
}
$("#filters").addEventListener("click", e => {
  const b = e.target.closest(".pill"); if (!b) return;
  state.filter = b.dataset.cat; renderFilters(); renderGrid();
});

/* Cards */
function actionHTML(p) {
  const q = state.cart[keyOf(p.id)] || 0;
  return q === 0
    ? `<button class="btn-add" data-act="add">Adicionar</button>`
    : `<div class="qty"><button data-act="dec" aria-label="Diminuir">−</button><span>${q}</span><button data-act="inc" aria-label="Aumentar">+</button></div>`;
}
function cardHTML(p) {
  const c = colorOf(p);
  return `<article class="card" data-id="${p.id}" style="--cat:${catColor(p.category)}">
    <div class="photo" style="--c:${c.hex}">
      ${photoHTML(p)}
      <span class="tag">${esc(p.category)}</span>
    </div>
    <div class="body">
      <div class="swatches" role="group" aria-label="Cores de ${esc(p.name)}">
        ${p.colors.map((col, i) => `<button class="sw" data-color="${i}" style="background:${col.hex}" aria-label="${esc(col.name)}" aria-pressed="${i === state.colorSel[p.id]}"></button>`).join("")}
        <span class="cname">${esc(c.name)}</span>
      </div>
      <h3>${esc(p.name)}</h3>
      <p class="desc">${esc(p.description)}</p>
      <p class="others">${othersHTML(p)}</p>
      <div class="buy"><span class="price">${money(p.price)}</span><div class="action">${actionHTML(p)}</div></div>
    </div>
  </article>`;
}
function renderGrid() {
  const list = PRODUCTS.filter(p => state.filter === "Todos" || p.category === state.filter);
  $("#grid").innerHTML = list.length ? list.map(cardHTML).join("") : `<p class="empty">Nenhum produto nesta categoria ainda.</p>`;
}
function refreshCard(id) {
  const card = document.querySelector(`.card[data-id="${id}"]`); if (!card) return;
  const p = byId(id), c = colorOf(p);
  card.querySelector(".photo").style.setProperty("--c", c.hex);
  card.querySelector(".cname").textContent = c.name;
  card.querySelectorAll(".sw").forEach((s, i) => s.setAttribute("aria-pressed", i === state.colorSel[id]));
  card.querySelector(".action").innerHTML = actionHTML(p);
  card.querySelector(".others").innerHTML = othersHTML(p);
}

$("#grid").addEventListener("click", e => {
  const card = e.target.closest(".card"); if (!card) return;
  const id = card.dataset.id;
  const arrow = e.target.closest(".arrow");
  if (arrow) { moveImg(id, +arrow.dataset.img); return; }
  const sw = e.target.closest(".sw");
  if (sw) { state.colorSel[id] = +sw.dataset.color; refreshCard(id); renderCart(); return; }
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (act) change(id, act === "dec" ? -1 : 1);
});

/* Carrinho */
function change(id, delta, ci = state.colorSel[id]) {
  const k = keyOf(id, ci);
  const q = Math.max(0, (state.cart[k] || 0) + delta);
  if (q === 0) delete state.cart[k]; else state.cart[k] = q;
  refreshCard(id); renderCart();
}
function cartLines() {
  return Object.entries(state.cart).map(([k, qty]) => {
    const [id, ci] = k.split("|");
    const p = byId(id), c = p.colors[+ci];
    return { p, c, ci: +ci, qty, sub: p.price * qty };
  });
}
function renderCart() {
  const lines = cartLines();
  const count = lines.reduce((s, l) => s + l.qty, 0);
  const total = lines.reduce((s, l) => s + l.sub, 0);
  $("#cbCount").textContent = count;
  $("#cbTotal").innerHTML = `<small>${count === 1 ? "1 item" : count + " itens"}</small>${money(total)}`;
  $("#cartbar").classList.toggle("show", count > 0);
  $("#dTotal").textContent = money(total);
  $("#items").innerHTML = lines.map(l => `
    <div class="line" data-id="${l.p.id}" data-ci="${l.ci}">
      <div class="dot" style="background:${l.c.hex}"></div>
      <div class="info"><b>${esc(l.p.name)}</b><span>Cor: ${esc(l.c.name)} • ${money(l.p.price)} un.</span>
        <div class="mini"><button data-act="dec" aria-label="Diminuir">−</button><b>${l.qty}</b><button data-act="inc" aria-label="Aumentar">+</button></div>
      </div>
      <div class="sub">${money(l.sub)}</div>
    </div>`).join("");
  if (count === 0) closeDrawer();
}
$("#items").addEventListener("click", e => {
  const act = e.target.closest("[data-act]")?.dataset.act;
  const line = e.target.closest(".line");
  if (act && line) change(line.dataset.id, act === "dec" ? -1 : 1, +line.dataset.ci);
});

/* Gaveta */
const openDrawer = () => { $("#overlay").classList.add("open"); $("#drawer").classList.add("open"); };
const closeDrawer = () => { $("#overlay").classList.remove("open"); $("#drawer").classList.remove("open"); };
$("#cartbar").addEventListener("click", openDrawer);
$("#overlay").addEventListener("click", closeDrawer);
$("#close").addEventListener("click", closeDrawer);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
$("#clear").addEventListener("click", () => {
  const ids = [...new Set(Object.keys(state.cart).map(k => k.split("|")[0]))]; state.cart = {};
  ids.forEach(refreshCard); renderCart();
});

/* WhatsApp */
$("#send").addEventListener("click", () => {
  const lines = cartLines(); if (!lines.length) return;
  const total = lines.reduce((s, l) => s + l.sub, 0);
  let msg = `*Novo pedido – ${CONFIG.brandName}*\n\n`;
  lines.forEach(l => {
    msg += `• ${l.qty}x ${l.p.name}\n   Cor: ${l.c.name}\n   Subtotal: ${money(l.sub)}\n`;
  });
  msg += `\n*Total: ${money(total)}*\n\nOlá! Gostaria de confirmar este pedido.`;
  window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`, "_blank", "noopener");
});

renderFilters(); renderGrid(); renderCart();

let touchX = null;
$("#grid").addEventListener("touchstart", e => {
  touchX = e.target.closest(".photo") ? e.touches[0].clientX : null;
}, { passive: true });
$("#grid").addEventListener("touchend", e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  const card = e.target.closest(".card");
  if (card && Math.abs(dx) > 40) moveImg(card.dataset.id, dx < 0 ? 1 : -1);
  touchX = null;
});

</script>
</body>
</html>
